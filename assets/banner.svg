<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0c1124" />
      <stop offset="100%" stop-color="#140f2d" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2a2450" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#25325c" stroke-width="0.8" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      @keyframes floatOrbs {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(25px, -20px) scale(1.1); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatPulse {
        0% { opacity: 0.35; transform: scale(0.98); }
        50% { opacity: 0.65; transform: scale(1.05); }
        100% { opacity: 0.35; transform: scale(0.98); }
      }
      @keyframes flowStroke {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes cardFloat {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }

      .bg-orb1 {
        animation: floatOrbs 9s ease-in-out infinite;
        transform-origin: center;
      }
      .bg-orb2 {
        animation: floatPulse 7s ease-in-out infinite;
        transform-origin: center;
      }
      .circuit-line {
        stroke-dasharray: 120 60;
        animation: flowStroke 12s linear infinite;
      }
      .floating-pill {
        animation: cardFloat 6s ease-in-out infinite;
      }
      .floating-pill-alt {
        animation: cardFloat 7s ease-in-out infinite 1s;
      }
    </style>
  </defs>

  <!-- Deep Cosmic Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <g class="bg-orb1">
    <circle cx="220" cy="110" r="140" fill="#0284c7" opacity="0.28" filter="url(#glowCyan)" />
  </g>
  <g class="bg-orb2">
    <circle cx="980" cy="300" r="160" fill="#9333ea" opacity="0.25" filter="url(#glowPurple)" />
    <circle cx="780" cy="90" r="110" fill="#ec4899" opacity="0.20" filter="url(#glowCyan)" />
  </g>

  <!-- Cybernetic Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Flowing Circuit / Stream Lines in Background -->
  <path class="circuit-line" d="M 0,90 Q 300,160 600,90 T 1200,120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path class="circuit-line" d="M 0,330 Q 350,260 700,340 T 1200,280" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Ambient Border Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- ================= FOREGROUND HERO BRANDING & CONTENT ================= -->
  <!-- Top Badge Pill -->
  <g transform="translate(485, 38)">
    <rect width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="18" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="1">CURATED DEVELOPER DIRECTORY</text>
  </g>

  <!-- Main Title (Crisp, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(600, 128)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#primaryTextGrad)" letter-spacing="-0.5">
      Awesome iOS Utilities &amp; Container Storage
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(600, 168)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Open-Source Container Runtimes • IPA Sideloading • Device Protocols • Mobile CI/CD &amp; Testing
    </text>
  </g>

  <!-- Decorative Foreground Visual Feature Pills -->
  <g class="floating-pill" transform="translate(90, 225)">
    <!-- Card 1: Container Storage -->
    <rect width="220" height="90" rx="12" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="35" cy="45" r="18" fill="#0369a1" fill-opacity="0.5" />
    <text x="35" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" fill="#38bdf8">📦</text>
    <text x="65" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Container Runtimes</text>
    <text x="65" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">LiveContainer, UTM &amp; JIT</text>
    <text x="65" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Jailed Sandboxing</text>
  </g>

  <g class="floating-pill-alt" transform="translate(340, 225)">
    <!-- Card 2: IPA Sideloading -->
    <rect width="230" height="90" rx="12" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="35" cy="45" r="18" fill="#4338ca" fill-opacity="0.5" />
    <text x="35" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" fill="#818cf8">📲</text>
    <text x="65" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Sideloading &amp; Signing</text>
    <text x="65" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">AltStore, TrollStore, Feather</text>
    <text x="65" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#818cf8">On-Device &amp; CLI Signing</text>
  </g>

  <g class="floating-pill" transform="translate(600, 225)">
    <!-- Card 3: Device Management -->
    <rect width="240" height="90" rx="12" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="35" cy="45" r="18" fill="#7e22ce" fill-opacity="0.5" />
    <text x="35" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" fill="#c084fc">⚙️</text>
    <text x="65" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Device Protocols &amp; CLI</text>
    <text x="65" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">libimobiledevice &amp; pymobiledevice3</text>
    <text x="65" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#c084fc">Tunnels, Syslog &amp; Storage</text>
  </g>

  <g class="floating-pill-alt" transform="translate(870, 225)">
    <!-- Card 4: CI/CD Infrastructure -->
    <rect width="240" height="90" rx="12" fill="url(#pillGrad)" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="35" cy="45" r="18" fill="#be185d" fill-opacity="0.5" />
    <text x="35" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" fill="#f472b6">🚀</text>
    <text x="65" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">CI/CD &amp; Distribution</text>
    <text x="65" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Fastlane, Tart, Tuist, Zealot</text>
    <text x="65" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#f472b6">Apple Silicon Virtualization</text>
  </g>

  <!-- Bottom Interactive Status Bar -->
  <g transform="translate(0, 365)">
    <rect width="1200" height="55" fill="#0b0f19" fill-opacity="0.85" />
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="90" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">
      💡 <tspan fill="#e2e8f0">Comprehensive iOS Matrix:</tspan> Commercial SaaS Platforms &amp; Fully Open-Source Self-Hosted Equivalents
    </text>
    <text x="1110" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">
      FOSS + HOSTED ECOSYSTEM
    </text>
  </g>
</svg>
